services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # NOT exposing 5432 to host — only accessible inside Docker network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-portfolio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_dev_pw}
      DB_NAME: ${POSTGRES_DB:-portfolio_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_in_production_at_least_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_too_in_production_32_chars_diff}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:4200
    # Run migrations before starting the app
    command: sh -c "npm run migration:run:prod && node dist/server.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    # This is the only port exposed to the host

volumes:
  postgres_data: